name: Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "*" ]

jobs:
  # Builds project
  build:
    name: Build project
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java with Maven
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build project
        run: mvn --batch-mode -DskipTests package

      - name: Run tests
        run: mvn --batch-mode test

