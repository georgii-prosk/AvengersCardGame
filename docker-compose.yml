services:
  postgres:
    image: postgres:17-alpine
    container_name: avengers-postgres
    environment:
      POSTGRES_DB: avengers
      POSTGRES_USER: avengers
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: